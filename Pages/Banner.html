<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Banner */

.banner {
  width: 100%;
  display: flex;
  justify-content: center;
  padding: 40px 20px;
}

.banner-div {
  max-width: 1200px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.heading h1 {
  color: #0a0a73;
  font-size: 64px;
  font-weight: 700;
  margin: 0;
  line-height: 1.2;
}

.banner-para {
  margin-top: 1rem;
  max-width: 700px;
  font-size: 18px;
  font-weight: 300;
  line-height: 1.6;
  color: #444;
}

.banner-btn {
  margin-top: 1.5rem;
}

.btn {
  background-color: #f26c18;
  border-radius: 8px;
  border: none;
  color: #fff;
  cursor: pointer;
  font-size: 15px;
  font-weight: 500;
  padding: 10px 18px;
  margin: 0 10px;
  transition: 0.3s ease;
}

.btn:hover {
  transform: scale(1.05);
}

.btn2 {
  background-color: #0a0a73;
}

/* Banner Media */
.banner-media {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  margin-top: 40px;
}

.banner-media > div {
  flex: 1 1 calc(33.333% - 20px); 
  max-width: calc(33.333% - 20px);
}

.banner-media img,
.banner-media video {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 15px;
  box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
}

.banner-video video {
  height: 250px;
  border-radius: 15px;
}

/* Banner Responsive*/


@media (max-width: 992px) {
  .heading h1 {
    font-size: 48px;
  }

  .banner-para {
    font-size: 16px;
    max-width: 90%;
  }

  .banner-media > div {
    flex: 1 1 calc(50% - 20px);
    max-width: calc(50% - 20px);
  }
}


@media (max-width: 600px) {
  .heading h1 {
    font-size: 32px;
  }

  .banner-para {
    font-size: 15px;
    line-height: 1.4;
  }

  .banner-btn {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn {
    width: 100%;
  }

  .banner-media > div {
    flex: 1 1 100%;
    max-width: 100%;
  }

  .banner-media img,
  .banner-media video {
    height: 200px;
  }
}

/* Small Phones */
@media (max-width: 400px) {
  .heading h1 {
    font-size: 26px;
  }

  .banner-para {
    font-size: 14px;
  }

  .banner-media img,
  .banner-media video {
    height: 180px;
  }
}
    </style>
</head>
<body>
    <section class="banner">
    <div class="banner-div">
        <div class="heading">
            <h1>Lighting the</h1>
            <h1>path to <span style="color:#f26c18">future</span> success</h1>
        </div>
        <p class="banner-para">
            Where students are encouraged to reach their full potential through rigorous coursework, innovative research, and a supportive learning environment.
        </p>
        <div class="banner-btn">
            <button class="btn1 btn">Start learn today</button>
            <button class="btn2 btn">Explore Program</button>
        </div>
        <div class="banner-media">
           <div class="banner-stat">
             <img src="https://cdn.prod.website-files.com/66d2b0d6f9dd1bce468522a2/66d584e27f342ce4458046aa_about-image-01.avif" alt="Statistics" />
           </div>
           <div class="banner-video">
             <video autoplay muted loop>
               <source src="https://cdn.prod.website-files.com/66d2b0d6f9dd1bce468522a2%2F66d2de6766d875ac32d21018_hero-video-01-transcode.mp4" type="video/mp4" />
               Your browser does not support the video tag.
             </video>
           </div>
           <div class="banner-img">
             <img src="https://cdn.prod.website-files.com/66d2b0d6f9dd1bce468522a2/66e543901763e997592475ae_hero-image-01.avif" alt="Banner Image" />
           </div>
        </div>
    </div>
</section>
</body>
</html>
