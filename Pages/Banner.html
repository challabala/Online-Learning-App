<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        /* Banner */

.banner {
      padding: 60px 20px;
      text-align: center;
    }
    .heading h1 {
      font-size: 54px;
      color: #0a0a73;
      margin-bottom: 10px;
    }
    .banner-para {
      max-width: 700px;
      margin: 0 auto 25px;
      font-size: 18px;
      color: #555;
    }
    .banner-btn .btn {
      background: #f26c18;
      border: none;
      color: #fff;
      padding: 12px 22px;
      margin: 0 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }
    .btn:hover { transform: scale(1.05); }
    .btn2 { background: #0a0a73; }
    .banner-media {
      margin-top: 40px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .banner-media img,
    .banner-media video {
      width: 100%;
      max-width: 360px;
      border-radius: 12px;
      object-fit: cover;
    }

    </style>
</head>
<body>
    <section class="banner">
    <div class="heading">
      <h1>Lighting the</h1>
      <h1>path to <span style="color:#f26c18">future</span> success</h1>
    </div>
    <p class="banner-para">Where students are encouraged to reach their full potential through rigorous coursework, innovative research, and a supportive learning environment.</p>
    <div class="banner-btn">
      <button class="btn">Start learn today</button>
      <button class="btn btn2">Explore Program</button>
    </div>
    <div class="banner-media">
      <img src="https://cdn.prod.website-files.com/66d2b0d6f9dd1bce468522a2/66d584e27f342ce4458046aa_about-image-01.avif" alt="">
      <video autoplay muted loop>
        <source src="https://cdn.prod.website-files.com/66d2b0d6f9dd1bce468522a2%2F66d2de6766d875ac32d21018_hero-video-01-transcode.mp4" type="video/mp4">
      </video>
      <img src="https://cdn.prod.website-files.com/66d2b0d6f9dd1bce468522a2/66e543901763e997592475ae_hero-image-01.avif" alt="">
    </div>
  </section>
</body>
</html>
