<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #fdfdfd, #f4f6ff);
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #0a0a73;
      font-size: 28px;
    }

    .course-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: auto;
      padding: 15px;
      border: 2px solid #f26c18;
    }

    .course-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      border: 2px solid #0a0a73;
    }

    .course-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      border-color: #f26c18;
    }

    .course-card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      display: block;
    }

    .time {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      font-size: 14px;
      color: #0a0a73;
      font-weight: 600;
      background: rgba(242, 108, 24, 0.1);
    }

    .time i {
      color: #f26c18;
      margin-right: 5px;
    }

    .card-content {
      padding: 14px 18px;
    }

    .card-content h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #0a0a73;
    }

    .card-content p {
      font-size: 14px;
      color: #444;
      margin: 6px 0 0;
      line-height: 1.4;
    }

    .price {
      padding: 12px 16px;
      font-weight: 700;
      font-size: 16px;
      color: #f26c18;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: flex-end;
      background: #fafafa;
    }

    .price i {
      margin-right: 4px;
    }

    /* Modal Styles */
    .modal {
      display: none; /* ✅ Hidden by default */
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 115, 0.9);
      align-items: center;   /* Keep flex alignment but don't force flex display */
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: #fff;
      border-radius: 14px;
      max-width: 900px;
      width: 100%;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .modal-content iframe {
      width: 100%;
      height: 500px;
      border: none;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 28px;
      color: #f26c18;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .close-btn:hover {
      color: #0a0a73;
    }

    @media (max-width: 768px) {
      .modal-content iframe {
        height: 300px;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 22px;
      }
      .card-content h3 {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <h1>Available Courses</h1>
  <div class="course-container" id="courses"></div>

  <!-- Modal -->
  <div class="modal" id="videoModal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <iframe id="videoFrame" src="" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const coursesData = {
      "courses": [
        {
          "title": "SQL Server",
          "description": "Learn SQL concepts and build database applications.",
          "thumbnail": "https://i.ytimg.com/vi/AA7i2GcTGwU/hq720.jpg?sqp=-oaymwEnCNAFEJQDSFryq4qpAxkIARUAAIhCGAHYAQHiAQoIGBACGAY4AUAB&rs=AOn4CLCL7k6qVYcFpgp9XKaHLxfW4Az4OA",
          "videoUrl": "https://www.youtube.com/embed/AA7i2GcTGwU?si=29JHk6cFqE1siSAb",
          "level": "Advanced",
          "duration": "4 hrs",
          "price": 499,
          "currency": "INR"
        },
        {
          "title": "MySQL",
          "description": "Full-stack development using MySQL from basics to web applications.",
          "thumbnail": "https://i.ytimg.com/vi/SycDH3NSJUU/hq720.jpg?sqp=-oaymwEnCNAFEJQDSFryq4qpAxkIARUAAIhCGAHYAQHiAQoIGBACGAY4AUAB&rs=AOn4CLBaliIwYUMs3PkKEb1pDZdcgbvQLA",
          "videoUrl": "https://www.youtube.com/embed/SycDH3NSJUU?si=oJalZgKvW7VriaaZ",
          "level": "Beginner",
          "duration": "10 hrs",
          "price": 699,
          "currency": "INR"
        },
        {
          "title": "PostgreSQL",
          "description": "Master PostgreSQL concepts and hands-on projects using PostgreSQL.",
          "thumbnail": "https://i.ytimg.com/vi/qw--VYLpxG4/hq720.jpg?sqp=-oaymwEnCNAFEJQDSFryq4qpAxkIARUAAIhCGAHYAQHiAQoIGBACGAY4AUAB&rs=AOn4CLCAz63XoUYDyBS-KQkZNDNOI8V-ag",
          "videoUrl": "https://www.youtube.com/embed/qw--VYLpxG4?si=DsoNjWd5bEwpYAnA",
          "level": "Intermediate",
          "duration": "4 hrs",
          "price": 799,
          "currency": "INR"
        },
        {

          "title": "Oracle",
          "description": "Full-stack development using Oracle—from basics to web applications.",
          "thumbnail": "https://i.ytimg.com/vi/iuvzjf7nU1I/hq720.jpg?sqp=-oaymwEnCNAFEJQDSFryq4qpAxkIARUAAIhCGAHYAQHiAQoIGBACGAY4AUAB&rs=AOn4CLD3WlTm_LYWDpDLFPNfyS8NdC8kdw",
          "videoUrl": "https://www.youtube.com/embed/iuvzjf7nU1I?si=bwGO_7f27NbUbYbh",
          "level": "Beginner",
          "duration": "7 hrs",
          "price": 899,
          "currency": "INR"
        },
        {
          "title": "MongoDB",
          "description": "Learn MongoDB from basics to advanced concepts.",
          "thumbnail": "https://i.ytimg.com/vi/aDd4HiGQSIU/hq720.jpg?sqp=-oaymwEnCNAFEJQDSFryq4qpAxkIARUAAIhCGAHYAQHiAQoIGBACGAY4AUAB&rs=AOn4CLCd2VEOiTmz5dpwO6E7Y7bEOSymYQ",
          "videoUrl": "https://www.youtube.com/embed/aDd4HiGQSIU?si=wGOshZBBs1Rah_-p",
          "level": "Beginner",
          "duration": "12 hrs",
          "price": 899,
          "currency": "INR"
        },
        {
          "title": "Cassandra NoSQL",
          "description": "Learn Cassandra NoSQL from basics to advanced concepts.",
          "thumbnail": "https://i.ytimg.com/vi/J-cSy5MeMOA/hq720.jpg?sqp=-oaymwEnCNAFEJQDSFryq4qpAxkIARUAAIhCGAHYAQHiAQoIGBACGAY4AUAB&rs=AOn4CLDI61SkW2CmIV_uQ-GDzwUw3luAtw",
          "videoUrl": "https://www.youtube.com/embed/J-cSy5MeMOA?si=pTDeaq4Uu7F6dHtq",
          "level": "Intermediate",
          "duration": "2 hrs",
          "price": 299,
          "currency": "INR"
        },
        {
          "title": "Redis NOSQL",
          "description": "Understand Redis NOSQL concepts and build applications.",
          "thumbnail": "https://i.ytimg.com/vi/XCsS_NVAa1g/hq720.jpg?sqp=-oaymwEnCNAFEJQDSFryq4qpAxkIARUAAIhCGAHYAQHiAQoIGBACGAY4AUAB&rs=AOn4CLBo8i4Djs9k-qWstlpD1O_w2UDZsA",
          "videoUrl": "https://www.youtube.com/embed/XCsS_NVAa1g?si=5M7fDkGhU9-g1umH",
          "level": "Advanced",
          "duration": "2 hrs",
          "price": 399,
          "currency": "INR"
        },
        {
          "title": "CoucheDB",
          "description": "Learn CoucheDB concepts and build database applications.",
          "thumbnail": "https://i.ytimg.com/vi/pV65gLFf0tI/hq720.jpg?sqp=-oaymwEnCNAFEJQDSFryq4qpAxkIARUAAIhCGAHYAQHiAQoIGBACGAY4AUAB&rs=AOn4CLBWdp9QXylh4uMPxKcNbwYLuyq1nQ",
          "videoUrl": "https://www.youtube.com/embed/pV65gLFf0tI?si=M14f7-s3u37xFTT5",
          "level": "Advanced",
          "duration": "10 hrs",
          "price": 1999,
          "currency": "INR"
        }
      ]
    }

    const coursesContainer = document.getElementById("courses");
    const modal = document.getElementById("videoModal");
    const videoFrame = document.getElementById("videoFrame");
    const closeModal = document.getElementById("closeModal");

    // Render Courses
    coursesData.courses.forEach(course => {
      const card = document.createElement("div");
      card.classList.add("course-card");

      card.innerHTML = `
        <img src="${course.thumbnail}" alt="${course.title}">
        <div class="time">
          <h3><i class="fa-solid fa-graduation-cap"></i> ${course.level}</h3>
          <h3><i class="fa-regular fa-clock"></i> ${course.duration}</h3>
        </div>
        <div class="card-content">
          <h3>${course.title}</h3>
          <p>${course.description}</p>
        </div>
        <div class="price">
          <h3><i class="fa-solid fa-indian-rupee-sign"></i> ${course.price}</h3>
        </div>
      `;

      // On card click -> open modal
      card.addEventListener("click", () => {
        videoFrame.src = course.videoUrl + "?autoplay=1";
        modal.style.display = "flex";
      });

      coursesContainer.appendChild(card);
    });

    // Close modal
    closeModal.addEventListener("click", () => {
      modal.style.display = "none";
      videoFrame.src = ""; // Stop video
    });

    // Close modal when clicking outside video
    window.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.style.display = "none";
        videoFrame.src = "";
      }
    });
  </script>
</body>
</html>
