<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        *{
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background-color: #f2f2f2;
        }
        footer {
      background: #f5f5f5;
      padding: 40px 20px;
      text-align: center;
    }
    .footer-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
      text-decoration: none;
      color: #0a0a73;
    }
    .subscribe-box {
      display: flex;
      justify-content: center;
      margin: 20px auto;
      max-width: 500px;
      background: #fff;
      border-radius: 30px;
      overflow: hidden;
    }
    .subscribe-box input {
      flex: 1;
      border: none;
      padding: 12px;
      outline: none;
    }
    .subscribe-box button {
      background: #ffd966;
      border: none;
      padding: 12px 20px;
      cursor: pointer;
      font-weight: 600;
    }
    .footer-links {
      margin: 20px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }
    .footer-links a { text-decoration: none; }
    .social-icons {
      display: flex;
      justify-content: center;
      gap: 15px;
    }
    .social-icons a {
      width: 40px; height: 40px;
      background: #fff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #2962ff;
      text-decoration: none;
      transition: 0.3s;
    }
    .social-icons a:hover { background: #2962ff; color: #fff; }
        
    </style>
</head>
<body>
    <footer>
    <a href="#" class="footer-logo">
      <div class="logo-icon"><i class="fa-solid fa-book"></i></div>
      <h2 class="logo-text"><span style="color:#f26c18">Logic</span> While</h2>
    </a>
    <div class="subscribe-box">
      <input type="email" placeholder="Enter email address">
      <button>Subscribe</button>
    </div>
    <div class="footer-links">
      <a href="#">Home</a> | <a href="#">Courses</a> | <a href="#">Events</a> | <a href="#">Contact</a>
    </div>
    <div class="social-icons">
      <a href="#"><i class="fab fa-facebook-f"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-x-twitter"></i></a>
      <a href="#"><i class="fab fa-linkedin-in"></i></a>
    </div>
  </footer>
</body>
</html>
