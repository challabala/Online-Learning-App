<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students Section</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
    /* Student Section */
.student {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  max-width: 1300px;
  width: 100%;
  margin: 100px auto 40px;
  padding: 0 20px;
}

/* Left stats box */
.stats-box {
  background: #f3f7ff;
  border-radius: 15px;
  padding: 30px 20px;
  text-align: center;
  width: 150px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
  flex-shrink: 0;
}

.stats-box .icon {
  background: #2962ff;
  color: #fff;
  font-size: 1.5rem;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 15px;
}

.stats-box p {
  font-size: 0.95rem;
  color: #333;
  margin-bottom: 10px;
}

.stats-box h3 {
  font-size: 1.8rem;
  color: #ff6b6b;
}

/* Main image */
.main-img {
  flex: 1;
  border-radius: 20px;
  width: 100%;
  max-height: 500px;
  object-fit: cover;
}

/* Small right image */
.side-img {
  width: 220px;
  border-radius: 15px;
  object-fit: cover;
  flex-shrink: 0;
}

/* Hero section */
.hero {
  text-align: center;
  max-width: 800px;
  margin: 100px auto;
  padding: 0 20px;
}

.hero h1 {
  font-size: 3.0rem;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 20px;
  color: #2a2a72;
}
.highlight-2 {
  color: #ff6b6b;
  /* background-color: transparent; */
}

/* Buttons */
.section-buttons {
  margin-top: 20px;
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.btn {
  padding: 12px 25px;
  border-radius: 30px;
  font-size: 1rem;
  cursor: pointer;
  border: none;
  transition: all 0.3s ease;
}

.btn-yellow {
  background-color: #fdd835;
  color: #000;
  font-weight: 600;
  border: 1px solid #fdd835;
}

.btn-yellow:hover {
  background-color: white;
  border-color: #fdd835;
}

.btn-link {
  background: transparent;
  color: #2a2a72;
  font-weight: 600;
  text-decoration: underline;
  cursor: pointer;
  border: none;
}

.btn-link:hover {
  color: #000;
}

    </style>
</head>
<body>
      <!-- student -->
  <section class="student">
    <!-- Stats Box -->
    <div class="stats-box">
      <div class="icon">🎓</div>
      <p>Total students</p>
      <h3>2310</h3>
    </div>

    <!-- Main Image -->
    <img src="https://cdn.prod.website-files.com/66d2b0d6f9dd1bce468522a2/66d585a69400e7c15c0b0753_about-image-02.avif" alt="Student Learning" class="main-img">

    <!-- Side Image -->
    <img src="https://cdn.prod.website-files.com/66d2b0d6f9dd1bce468522a2/66d585eb7c6c967e491cca82_about-image-03.avif" alt="Study Materials" class="side-img">
  </section>

  <!-- Hero Section -->
  <div class="hero">
    <h1>
      Ready to achieve <span class="highlight-2">greatness</span><br>
      in your studies?
    </h1>

    <!-- Buttons -->
    <div class="section-buttons">
      <button class="btn btn-yellow">Join for free</button>
      <button class="btn btn-link">Watch demo</button>
    </div>
  </div>
</body>
</html>
