    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #fdfdfd, #f4f6ff);
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 15px;
      color: #0a0a73;
      font-size: 28px;
    }

    /* ✅ Search bar */
    .search-box {
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
    }

    .search-box input {
      width: 100%;
      max-width: 400px;
      padding: 10px 15px;
      font-size: 15px;
      border-radius: 8px;
      border: 2px solid #0a0a73;
      outline: none;
      transition: border 0.3s;
    }

    .search-box input:focus {
      border-color: #f26c18;
    }

    .course-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: auto;
      padding: 15px;
      border: 2px solid #f26c18;
    }

    .course-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 2px solid #0a0a73;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .course-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      border-color: #f26c18;
    }

    .course-card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      display: block;
    }

    .time {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      font-size: 14px;
      color: #0a0a73;
      font-weight: 600;
      background: rgba(242, 108, 24, 0.1);
    }

    .time i {
      color: #f26c18;
      margin-right: 5px;
    }

    .card-content {
      padding: 14px 18px;
      flex-grow: 1;
    }

    .card-content h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #0a0a73;
    }

    .card-content p {
      font-size: 14px;
      color: #444;
      margin: 6px 0 0;
      line-height: 1.4;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-top: 1px solid #eee;
      background: #fafafa;
    }

    .price {
      font-weight: 700;
      font-size: 16px;
      color: #f26c18;
    }

    .price i {
      margin-right: 4px;
    }

    /* ✅ Add to cart button */
    .add-to-cart {
      background: #0a0a73;
      color: #fff;
      border: none;
      padding: 6px 12px;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .add-to-cart:hover {
      background: #f26c18;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 115, 0.9);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: #fff;
      border-radius: 14px;
      max-width: 900px;
      width: 100%;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .modal-content iframe {
      width: 100%;
      height: 500px;
      border: none;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 28px;
      color: #f26c18;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .close-btn:hover {
      color: #0a0a73;
    }

    @media (max-width: 768px) {
      .modal-content iframe {
        height: 300px;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 22px;
      }
      .card-content h3 {
        font-size: 16px;
      }
    }
  </style>
</head>

    const coursesContainer = document.getElementById("courses");
    const modal = document.getElementById("videoModal");
    const videoFrame = document.getElementById("videoFrame");
    const closeModal = document.getElementById("closeModal");
    const searchInput = document.getElementById("searchInput");

    // ✅ Function to render courses
    function renderCourses(courses) {
      coursesContainer.innerHTML = "";
      if (courses.length === 0) {
        coursesContainer.innerHTML = "<p>No courses found.</p>";
        return;
      }
      courses.forEach(course => {
        const card = document.createElement("div");
        card.classList.add("course-card");

        card.innerHTML = `
          <img src="${course.thumbnail}" alt="${course.title}">
          <div class="time">
            <h3><i class="fa-solid fa-graduation-cap"></i> ${course.level}</h3>
            <h3><i class="fa-regular fa-clock"></i> ${course.duration}</h3>
          </div>
          <div class="card-content">
            <h3>${course.title}</h3>
            <p>${course.description}</p>
          </div>
          <div class="card-footer">
            <button class="add-to-cart"><i class="fa-solid fa-cart-shopping"></i> Add to Cart</button>
            <div class="price"><i class="fa-solid fa-indian-rupee-sign"></i> ${course.price}</div>
          </div>
        `;

        // Video play on image click
        card.querySelector("img").addEventListener("click", () => {
          videoFrame.src = course.videoUrl + "?autoplay=1";
          modal.style.display = "flex";
        });

        // Add to cart click
        card.querySelector(".add-to-cart").addEventListener("click", (e) => {
          e.stopPropagation();
          alert(`${course.title} added to cart!`);
        });

        coursesContainer.appendChild(card);
      });
    }

    // ✅ Initial render
    renderCourses(coursesData.courses);

    // ✅ Search filter
    searchInput.addEventListener("input", () => {
      const searchValue = searchInput.value.toLowerCase();
      const filteredCourses = coursesData.courses.filter(course =>
        course.title.toLowerCase().includes(searchValue) ||
        course.description.toLowerCase().includes(searchValue)
      );
      renderCourses(filteredCourses);
    });

    // Close modal
    closeModal.addEventListener("click", () => {
      modal.style.display = "none";
      videoFrame.src = "";
    });

    window.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.style.display = "none";
        videoFrame.src = "";
      }
    });
  </script>
