<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url(https://cdn.prod.website-files.com/66d2b0d6f9dd1bce468522a2/66daf2de0bcfad5a973dd871_about-image-08.avif);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      position: relative;
    }

    .container {
      background: #fff;
      padding: 40px 35px;
      border-radius: 15px;
      width: 100%;
      max-width: 400px;
      position: relative;
      box-shadow: rgba(3, 102, 214, 0.3) 0px 0px 0px 3px;
    }

    .container h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 26px;
      color: #0a0a73;
    }

    .input-data {
      margin-bottom: 20px;
    }

    .input-data label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 6px;
    }

    .input-data input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    .input-data input:focus {
      border: 2px solid #f26c18;
      box-shadow: 0 0 5px rgba(37, 117, 252, 0.5);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #0a0a73;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #f26c18;
    }

    .signup {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }

    .signup a {
      color: #2575fc;
      text-decoration: none;
      font-weight: 600;
    }

    .signup a:hover {
      text-decoration: underline;
    }

    /* Toast Styles */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 9999;
    }

    .toast {
      padding: 12px 20px;
      border-radius: 8px;
      color: white;
      font-weight: 500;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      opacity: 0;
      transform: translateX(100%);
      animation: slideIn 0.5s forwards, fadeOut 0.5s 2.5s forwards;
    }

    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: translateX(100%);
      }
    }

    .success { background-color: #28a745; }
    .error { background-color: #dc3545; }
    .info { background-color: #007bff; }
    .warning { background-color: #ffc107; color: #333; }

    @media (max-width: 480px) {
      .container {
        width: 95%;
        padding: 20px;
      }
      .container h2 {
        font-size: 20px;
      }
      .input-data input {
        padding: 10px;
        font-size: 14px;
      }
      .btn {
        font-size: 14px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <form id="loginForm">
      <div class="input-data">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>
      <div class="input-data">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
    <p class="signup">Don’t have an account? <a href="./SignUp.html">Sign Up</a></p>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    // Toast function
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');

      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;

      container.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 3000);
    }

    // Login logic
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      let email = document.getElementById("email").value;
      let password = document.getElementById("password").value;

      let storedUser = JSON.parse(localStorage.getItem("user"));

      if (storedUser && storedUser.email === email && storedUser.password === password) {
        showToast("✅ Login Successful! Welcome " + storedUser.firstName, "success");
        document.getElementById("loginForm").reset();
        
        setTimeout(() => {
          window.location.href = "../index.html"; 
        }, 2000);
      } else {
        showToast("❌ Invalid Email or Password. Please try again.", "error");
      }
    });
  </script>
</body>
</html>
