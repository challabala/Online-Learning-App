<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url(https://cdn.prod.website-files.com/66d2b0d6f9dd1bce468522a2/66daf2de0bcfad5a973dd871_about-image-08.avif);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      position: relative;
    }

    .container {
      background: #fff;
      padding: 40px 35px;
      border-radius: 15px;
      width: 100%;
      max-width: 400px;
      position: relative;
    }

    .container h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 26px;
      color: #0a0a73;
    }

    .input-data {
      margin-bottom: 20px;
    }

    .input-data label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 6px;
    }

    .input-data input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    .input-data input:focus {
      border: 2px solid #f26c18;
      box-shadow: 0 0 5px rgba(37, 117, 252, 0.5);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #0a0a73;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #f26c18;
    }

    .login {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }

    .login a {
      color: #2575fc;
      text-decoration: none;
      font-weight: 600;
    }

    .login a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .container {
        width: 95%;
        padding: 20px;
      }
      .container h2 {
        font-size: 20px;
      }
      .input-data input {
        padding: 10px;
        font-size: 14px;
      }
      .btn {
        font-size: 14px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Sign Up</h2>
    <form id="signupForm">
      <div class="input-data">
        <label for="first-name">First Name</label>
        <input type="text" id="first-name" placeholder="Enter your first name" required>
      </div>
      <div class="input-data">
        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" placeholder="Enter your last name" required>
      </div>
      <div class="input-data">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>
      <div class="input-data">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required>
      </div>
      <button type="submit" class="btn">Create Account</button>
    </form>
    <p class="login">Already have an account? <a href="./Login.html">Login</a></p>
  </div>

  <script>
    
    document.getElementById("signupForm").addEventListener("submit", function(e) {
      e.preventDefault();

      let firstName = document.getElementById("first-name").value;
      let lastName = document.getElementById("last-name").value;
      let email = document.getElementById("email").value;
      let password = document.getElementById("password").value;

      let user = {
        firstName,
        lastName,
        email,
        password
      };

      localStorage.setItem("user", JSON.stringify(user));
      alert("Account Created Successfully! 🎉");
      document.getElementById("signupForm").reset();
      window.location.href = "./Login.html"
    });
  </script>
</body>
</html>
